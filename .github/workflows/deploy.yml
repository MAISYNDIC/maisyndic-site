# Met le site en ligne sur l'hébergement OVH à chaque modification envoyée sur GitHub.
# Le mot de passe FTP/SFTP est stocké dans le secret « FTP_PASSWORD » du dépôt (jamais dans les fichiers).
name: Mise en ligne OVH

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-ovh
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer les fichiers du site
        uses: actions/checkout@v4

      - name: Installer lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: Envoyer le site dans le dossier www (SFTP)
        env:
          LFTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          if [ -z "$LFTP_PASSWORD" ]; then echo "Le secret FTP_PASSWORD n'est pas encore défini."; exit 1; fi
          lftp -c "set sftp:auto-confirm yes; set net:max-retries 3; set net:timeout 30; \
            open --env-password -u maisynh sftp://ssh.cluster129.hosting.ovh.net; \
            mirror --reverse --delete --verbose --exclude-glob .git* --exclude .github/ ./ www/"
